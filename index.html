<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resgate Rápido</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f4f5fb; --surface:#ffffff; --surface-2:#edeffa; --border:#dde1f2;
    --text:#161a2c; --muted:#666d92; --accent:#4a4ff2; --accent-ink:#ffffff;
    --success:#1f9d6c; --success-bg:#e3f6ec; --warning:#a8720a; --warning-bg:#fdf0d9;
    --danger:#c72e46; --danger-bg:#fbe3e8; --radius:16px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0e1b; --surface:#141a30; --surface-2:#1b2342; --border:#2b3460;
      --text:#eef0fb; --muted:#99a0c4; --accent:#8b93ff; --accent-ink:#0b0e1b;
      --success:#3ccf95; --success-bg:rgba(60,207,149,.14); --warning:#ffbd5c; --warning-bg:rgba(255,189,92,.14);
      --danger:#ff6b83; --danger-bg:rgba(255,107,131,.14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0e1b; --surface:#141a30; --surface-2:#1b2342; --border:#2b3460;
    --text:#eef0fb; --muted:#99a0c4; --accent:#8b93ff; --accent-ink:#0b0e1b;
    --success:#3ccf95; --success-bg:rgba(60,207,149,.14); --warning:#ffbd5c; --warning-bg:rgba(255,189,92,.14);
    --danger:#ff6b83; --danger-bg:rgba(255,107,131,.14);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Work Sans",-apple-system,sans-serif; padding-inline:16px;
  }
  h1,h2,h3,.display{ font-family:"Unbounded",sans-serif; }
  .mono{ font-family:"JetBrains Mono",monospace; }
  a{ color:var(--accent); }

  #app{ max-width:1080px; margin:0 auto; padding-block:28px 60px; }

  .app-header{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .app-header .lockup{ display:flex; align-items:center; gap:12px; }
  .app-header .badge-logo{ width:42px; height:42px; border-radius:12px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .app-header h1{ font-size:19px; margin:0; letter-spacing:.2px; }
  .app-header p{ margin:2px 0 0; color:var(--muted); font-size:13px; }

  .switcher{ display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px; }
  .switcher button{ border:none; background:transparent; color:var(--muted); padding:9px 16px; border-radius:999px; font-weight:600; font-size:13px; cursor:pointer; font-family:inherit; }
  .switcher button.active{ background:var(--accent); color:var(--accent-ink); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:18px; }
  .card h2{ font-size:16px; margin:0 0 4px; }
  .card .desc{ color:var(--muted); font-size:13px; margin:0 0 16px; }

  .subnav{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .subnav button{ border:1px solid var(--border); background:var(--surface); color:var(--muted); padding:8px 14px; border-radius:10px; font-weight:600; font-size:13px; cursor:pointer; font-family:inherit; }
  .subnav button.active{ background:var(--surface-2); color:var(--text); border-color:var(--accent); }

  label{ display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  input[type=text], input[type=password], input[type=tel], select{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14px; font-family:inherit;
  }
  input:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--accent); color:var(--accent-ink); border:none; padding:12px 18px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; width:100%; margin-top:16px; }
  .btn.secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn.danger{ background:var(--danger); color:#fff; }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--muted); }
  .btn.small{ width:auto; padding:7px 12px; margin-top:0; font-size:12px; }
  .btn.wa{ background:#25D366; color:#04310f; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .grid-checks{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin-top:6px; }
  .grid-checks label.item{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; margin:0; text-transform:none; font-weight:500; font-size:13px; color:var(--text); }
  .grid-checks input{ width:auto; }

  .pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
  .pill.livre, .pill.resgatado, .pill.success{ background:var(--success-bg); color:var(--success); }
  .pill.usado{ background:var(--surface-2); color:var(--muted); }
  .pill.pendente{ background:var(--warning-bg); color:var(--warning); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); }
  th{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .table-wrap{ overflow-x:auto; }

  .alert{ padding:11px 14px; border-radius:10px; margin-bottom:14px; font-size:13px; font-weight:500; }
  .alert.error{ background:var(--danger-bg); color:var(--danger); }
  .alert.success{ background:var(--success-bg); color:var(--success); }
  .alert.info{ background:var(--surface-2); color:var(--text); }

  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:18px; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .stat .num{ font-family:"JetBrains Mono",monospace; font-size:26px; font-weight:600; }
  .stat .label{ color:var(--muted); font-size:12px; margin-top:2px; }

  .game-block{ border-top:1px solid var(--border); padding-top:16px; margin-top:16px; }
  .game-block:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .game-block-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .game-row{ display:flex; align-items:center; gap:12px; cursor:pointer; background:none; border:none; padding:0; text-align:left; font-family:inherit; flex:1; min-width:0; }
  .game-row .chevron{ display:inline-flex; width:22px; height:22px; align-items:center; justify-content:center; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); transition:transform .15s ease; flex-shrink:0; }
  .game-row .chevron.open{ transform:rotate(90deg); }
  .game-right{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .game-counts{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

  .public-wrap{ max-width:440px; margin:0 auto; }
  .steps{ display:flex; gap:6px; margin-bottom:18px; }
  .steps .dot{ flex:1; height:4px; border-radius:3px; background:var(--border); }
  .steps .dot.on{ background:var(--accent); }
  .center{ text-align:center; }
  .emoji{ font-size:36px; margin-bottom:8px; }

  .game-pick{ display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:15px; margin-bottom:9px; color:var(--text); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .game-pick:hover:not(:disabled){ border-color:var(--accent); }

  .cred-box{ background:var(--surface-2); border:1.5px dashed var(--accent); border-radius:12px; padding:16px; margin:14px 0; }
  .cred-row{ display:flex; justify-content:space-between; padding:5px 0; font-size:13px; gap:10px; }
  .cred-row span:first-child{ color:var(--muted); }
  .cred-row span:last-child{ font-family:"JetBrains Mono",monospace; font-weight:600; word-break:break-all; text-align:right; }

  .muted{ color:var(--muted); font-size:13px; }
  .row-actions{ display:flex; gap:8px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  footer.note{ text-align:center; color:var(--muted); font-size:11px; margin-top:30px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(10,12,25,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal-box{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; max-width:360px; width:100%; }
  .modal-box h3{ margin:0 0 8px; font-size:16px; }
  .modal-box p{ margin:0 0 18px; color:var(--muted); font-size:13px; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .btn{ margin-top:0; }
</style>
</head>
<body>
<div id="app">Carregando…</div>

<script src="firebase-config.js"></script>
<script src="seed-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.13.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

(function(){
  "use strict";

  // ---------------- helpers ----------------
  function esc(s){
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function normCep(v){ return (v||'').replace(/\D/g,''); }
  function normNome(v){ return (v||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function fmtDate(iso){ if(!iso) return '-'; try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return iso; } }

  // ---------------- cor por mês de envio ----------------
  var MONTH_PALETTE = ['#ef4444','#f97316','#f59e0b','#84cc16','#10b981','#06b6d4','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#64748b'];
  var MONTH_NAMES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function monthKey(iso){ if(!iso) return null; return iso.slice(0,7); } // "YYYY-MM"
  function monthColor(ym){ var m = parseInt(ym.split('-')[1],10); return MONTH_PALETTE[(m-1+12)%12]; }
  function monthLabel(ym){ var parts = ym.split('-'); var m = parseInt(parts[1],10); return MONTH_NAMES[(m-1+12)%12]+'/'+parts[0].slice(2); }
  function sentDot(a){
    if (a.status !== 'usado' || !a.usadoEm) return '<span class="muted">—</span>';
    var ym = monthKey(a.usadoEm);
    var color = monthColor(ym);
    var label = (a.dataAproximada ? '~ ' : '') + monthLabel(ym);
    return '<span style="display:inline-flex;align-items:center;gap:6px;">' +
      '<span style="width:10px;height:10px;border-radius:50%;background:'+color+';display:inline-block;'+(a.dataAproximada?'border:1.5px dashed rgba(0,0,0,.25);':'')+'"></span>' +
      '<span style="font-size:12px;">'+esc(label)+'</span>' +
    '</span>';
  }
  function renderLegend(){
    var months = {};
    state.accounts.forEach(function(a){
      if (a.status==='usado' && a.usadoEm){ months[monthKey(a.usadoEm)] = true; }
    });
    var keys = Object.keys(months).sort();
    var html = '<div class="card" style="padding:16px;">' +
      '<h2 style="font-size:13px;">Legenda — mês de envio</h2>';
    if (keys.length===0){
      html += '<p class="muted" style="margin:0;">Nenhum envio registrado ainda.</p>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:6px;">';
      keys.forEach(function(ym){
        html += '<div style="display:flex;align-items:center;gap:8px;font-size:12px;">' +
          '<span style="width:10px;height:10px;border-radius:50%;background:'+monthColor(ym)+';display:inline-block;"></span>' +
          '<span>'+esc(monthLabel(ym))+'</span></div>';
      });
      html += '</div><p class="muted" style="margin:10px 0 0;font-size:11px;">~ = mês aproximado (importado da planilha antiga, sem dia exato)</p>';
    }
    html += '</div>';
    return html;
  }

  var MAX_TENT = 4;
  var BLOQUEIO_MS = 3*60*60*1000;

  function getAttempts(){
    try { return JSON.parse(localStorage.getItem('rr_attempts')||'{}'); } catch(e){ return {}; }
  }
  function setAttempts(v){
    try { localStorage.setItem('rr_attempts', JSON.stringify(v)); } catch(e){}
  }
  function isLocked(a){ return a.lockedUntil && new Date(a.lockedUntil).getTime() > Date.now(); }
  function registerFailure(){
    var a = getAttempts();
    a.count = (a.count||0)+1;
    if (a.count >= MAX_TENT){ a.lockedUntil = new Date(Date.now()+BLOQUEIO_MS).toISOString(); a.count = 0; }
    setAttempts(a);
    return a;
  }
  function registerSuccess(){ setAttempts({count:0, lockedUntil:null}); }

  // ---------------- state ----------------
  var state = {
    ready: false,
    view: 'public', // 'admin' | 'public'
    adminAuthed: (function(){ try { return sessionStorage.getItem('rr_admin')==='1'; } catch(e){ return false; } })(),
    adminTab: 'dashboard',
    games: [],
    accounts: [],
    clients: [],
    adminUsers: [],
    adminUsersLoaded: false,
    seededAdmin: false,
    loginError: null,
    adminMsg: null,
    msg: null, // {type,text} transient admin message
    manualError: null,
    manualSuccess: null,
    config: {},
    configMsg: null,
    confirm: null, // {kind, id, step, label} — modal de confirmação em duas etapas
    importMsg: null,
    expandedGames: {}, // { [gameId]: true } — quais jogos estão com a lista de acessos aberta
    expandedAccounts: {}, // { [accountId]: true } — quais acessos têm código/senha visíveis
    editingAccount: null, // id do acesso sendo editado no momento
    public: { step:1, nomeComprador:'', telefone:'', cep:'', clientId:null, resultAccountId:null, error:null, lockInfo:null }
  };

  var db = null;

  function render(){
    var app = document.getElementById('app');
    app.innerHTML = renderHeader() + (state.view === 'admin' ? renderAdmin() : renderPublic()) + renderFooter() + renderConfirmModal();
  }

  var CONFIRM_STEPS = {
    'delete-game': [
      {title:'Excluir este jogo?', text:'Tem certeza que deseja excluir esse jogo? Todos os acessos cadastrados nele também serão apagados.'},
      {title:'Confirmar exclusão', text:'Confirma mesmo que quer excluir? Essa ação não pode ser desfeita.'}
    ],
    'delete-account': [
      {title:'Remover este acesso?', text:'Tem certeza que deseja remover este acesso do estoque?'}
    ],
    'delete-client': [
      {title:'Remover este cadastro?', text:'Tem certeza que deseja remover este cadastro de cliente?'}
    ],
    'delete-admin': [
      {title:'Remover este login de admin?', text:'Tem certeza que deseja remover este acesso de administrador?'}
    ],
    'reset-all': [
      {title:'Resetar todos os dados?', text:'Isso vai apagar TODOS os jogos, contas e clientes de teste. Tem certeza?'},
      {title:'Confirmar reset', text:'Confirma mesmo que quer apagar tudo? Essa ação não pode ser desfeita.'}
    ],
    'reset-account': [
      {title:'Tornar este acesso disponível de novo?', text:'Esse acesso vai voltar para o estoque como disponível (livre). Use isso se houve algum erro na entrega. Tem certeza?'}
    ],
    'mark-used': [
      {title:'Marcar este acesso como usado?', text:'Esse acesso vai sair do estoque disponível e ficar marcado como usado, sem vincular a nenhum cliente. Tem certeza?'}
    ]
  };

  function renderConfirmModal(){
    if (!state.confirm) return '';
    var steps = CONFIRM_STEPS[state.confirm.kind];
    if (!steps) return '';
    var s = steps[state.confirm.step] || steps[0];
    return '<div class="modal-overlay">' +
      '<div class="modal-box">' +
        '<h3>'+esc(s.title)+'</h3>' +
        '<p>'+esc(s.text)+'</p>' +
        '<div class="modal-actions">' +
          '<button class="btn secondary" data-confirm="no">Cancelar</button>' +
          '<button class="btn danger" data-confirm="yes">Sim</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function renderHeader(){
    return (
      '<div class="app-header">' +
        '<div class="lockup">' +
          '<div class="badge-logo">🎮</div>' +
          '<div><h1>Shopping dos Presentes Oficial</h1><p>A sua maior loja de consoles e jogos dentro do Mercado Livre</p></div>' +
        '</div>' +
        '<div class="switcher">' +
          '<button data-nav="public" class="' + (state.view==='public'?'active':'') + '">Visão do cliente</button>' +
          '<button data-nav="admin" class="' + (state.view==='admin'?'active':'') + '">Painel admin</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderFooter(){
    return '<footer class="note">Sistema Resgate Rápido — dados salvos em tempo real.</footer>';
  }

  // ================= ADMIN =================

  function renderAdmin(){
    if (!state.adminAuthed) return renderAdminLogin();
    var body = '';
    body += renderAdminSubnav();
    if (state.adminTab === 'dashboard') body += renderDashboard();
    else if (state.adminTab === 'jogos') body += renderJogos();
    else if (state.adminTab === 'clientes') body += renderClientes();
    else if (state.adminTab === 'manual') body += renderManual();
    else if (state.adminTab === 'config') body += renderConfig();
    return body;
  }

  function renderAdminLogin(){
    return (
      '<div class="card" style="max-width:360px;margin:20px auto;">' +
        '<div class="center emoji">🔐</div>' +
        '<h2 class="center">Painel Admin</h2>' +
        (state.adminUsers.length===0 ? '<p class="desc center">Usuário: <code>admin</code> · Senha: <code>admin123</code></p>' : '') +
        (state.loginError ? '<div class="alert error">'+esc(state.loginError)+'</div>' : '') +
        '<form id="loginForm">' +
          '<label>Usuário</label><input type="text" id="loginUser" autocomplete="off">' +
          '<label>Senha</label><input type="password" id="loginPass">' +
          '<button class="btn" type="submit">Entrar</button>' +
        '</form>' +
      '</div>'
    );
  }

  function renderAdminSubnav(){
    var tabs = [['dashboard','Início'],['jogos','Jogos & Estoque'],['clientes','Clientes'],['manual','Resgate Manual'],['config','Configurações']];
    var html = '<div class="subnav">';
    tabs.forEach(function(t){
      html += '<button data-admintab="'+t[0]+'" class="'+(state.adminTab===t[0]?'active':'')+'">'+t[1]+'</button>';
    });
    html += '<button data-action="reset-all" class="btn danger small" style="margin-left:auto;">Resetar dados de teste</button>';
    html += '<button data-action="logout" class="btn ghost small">Sair</button>';
    html += '</div>';
    return html;
  }

  function renderDashboard(){
    var totalGames = state.games.length;
    var livres = state.accounts.filter(function(a){return a.status==='livre';}).length;
    var usados = state.accounts.filter(function(a){return a.status==='usado';}).length;
    var pendentes = state.clients.filter(function(c){return c.status==='pendente';}).length;

    var byGame = state.games.map(function(g){
      var l = state.accounts.filter(function(a){return a.gameId===g.id && a.status==='livre';}).length;
      return {nome:g.nome, livres:l};
    }).sort(function(a,b){return a.livres-b.livres;});

    var html = '<div class="stat-grid">' +
      stat(totalGames,'Jogos cadastrados') +
      stat(livres,'Acessos livres') +
      stat(usados,'Acessos usados') +
      stat(pendentes,'Clientes aguardando') +
      '</div>';

    html += '<div class="card"><h2>Estoque por jogo</h2><div class="table-wrap"><table><tr><th>Jogo</th><th>Livres</th></tr>';
    if (byGame.length===0) html += '<tr><td colspan="2" class="muted">Nenhum jogo cadastrado ainda.</td></tr>';
    byGame.forEach(function(g){
      html += '<tr><td>'+esc(g.nome)+'</td><td>'+(g.livres===0?'<span class="pill pendente">0 — sem estoque</span>':g.livres)+'</td></tr>';
    });
    html += '</table></div></div>';
    return html;
  }
  function stat(num,label){ return '<div class="stat"><div class="num">'+num+'</div><div class="label">'+label+'</div></div>'; }

  function renderJogos(){
    var html = '';
    if (state.msg) html += '<div class="alert '+state.msg.type+'">'+esc(state.msg.text)+'</div>';

    html += '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;">' +
      '<div style="flex:2;min-width:280px;"><div class="card">' +
        '<h2>Adicionar acesso</h2>' +
        '<p class="desc">Digite o nome do jogo — se já existir, o sistema reconhece e agrupa junto; se for novo, ele já cria o jogo.</p>' +
        '<form id="addAccessForm" autocomplete="off">' +
          '<label>Nome do jogo</label>' +
          '<div style="position:relative;">' +
            '<input type="text" id="newGameName" placeholder="Ex: FC26" required autocomplete="off">' +
            '<div id="gameSuggestions" style="position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-top:4px;overflow:hidden;"></div>' +
          '</div>' +
          '<div class="field-row">' +
            '<div><label>E-mail</label><input type="text" id="newAccEmail" required></div>' +
            '<div><label>Senha</label><input type="text" id="newAccSenha" required></div>' +
          '</div>' +
          '<div class="field-row">' +

    if (state.games.length === 0){

    state.games.forEach(function(g){
      var accs = state.accounts.filter(function(a){return a.gameId===g.id;});

      if (open){

          html += '<div class="table-wrap" style="margin-top:16px;"><table><tr><th>E-mail</th><th>Fornecedor</th><th>Status</th><th>Enviado</th><th>Cliente</th><th></th></tr>';

            var accOpen = !!state.expandedAccounts[a.id];
            html += '<tr>' +
              '<td><button class="game-row" style="padding:0;" data-action="toggle-account" data-id="'+a.id+'"><span class="chevron'+(accOpen?' open':'')+'" style="font-size:11px;">▶</span> '+esc(a.email)+'</button></td>' +

              '<td><span class="pill '+a.status+'">'+a.status+'</span></td>' +
              '<td>'+sentDot(a)+'</td>' +

                ('<div style="display:flex;gap:6px;flex-wrap:wrap;"><button class="btn secondary small" data-action="mark-used" data-id="'+a.id+'">Tornar usado</button><button class="btn danger small" data-action="delete-account" data-id="'+a.id+'">Remover</button></div>')

  // ================= PUBLIC (visão do cliente) =================

  function renderPublic(){
    var p = state.public;
    var attempts = getAttempts();
    if (isLocked(attempts)) return renderLocked(attempts);

    var html = '<div class="public-wrap">';
    html += '<div class="steps">' + [1,2,3,4].map(function(n){ return '<div class="dot '+(p.step>=n?'on':'')+'"></div>'; }).join('') + '</div>';

    if (p.step === 1) html += renderStep1();
    else if (p.step === 2) html += renderStep2();
    else if (p.step === 3) html += renderStep3();
    else if (p.step === 4) html += renderStep4();

    html += '</div>';
    return html;
  }

    var msg = encodeURIComponent(text || 'Olá! Preciso de ajuda para resgatar meu jogo.');

    return '<a class="btn wa" href="https://wa.me/'+numero+'?text='+msg+'" target="_blank">Falar no WhatsApp</a>';
  }

  function renderStep3(){
    var p = state.public;
    var client = state.clients.find(function(c){ return c.id === p.clientId; });
    if (!client) return '<div class="card"><p class="muted">Sessão expirada. <button class="btn small" data-action="reset-public">Recomeçar</button></p></div>';

    var games = (client.allowedGameIds||[]).map(function(id){ return state.games.find(function(g){return g.id===id;}); }).filter(Boolean).map(function(g){
      var l = state.accounts.filter(function(a){return a.gameId===g.id && a.status==='livre';}).length;
      return {id:g.id, nome:g.nome, livres:l};
    });

    // tela de confirmação antes de resgatar de verdade
    if (p.confirmGameId){
      var gConfirm = games.find(function(g){ return g.id === p.confirmGameId; });

          '<p class="desc center">Você deseja confirmar que vai resgatar o jogo <strong>'+esc(gConfirm.nome)+'</strong>? Depois de confirmar, você não poderá trocar.</p>' +

  // ---------------- data ops ----------------

  function addGame(nome){
    return db.collection('games').add({ nome: nome, createdAt: new Date().toISOString() });
  }
  function findGameByName(nome){
    var alvo = (nome||'').trim().toLowerCase();
    return state.games.find(function(g){ return g.nome.trim().toLowerCase() === alvo; }) || null;
  }
  function setConfig(videoUrl, lojaNome, whatsapp){
    return db.doc('config/app').set({ videoUrl: videoUrl || '', lojaNome: lojaNome || '', whatsapp: whatsapp || '' });
  }
  function deleteGame(gameId){
    var batchDeletes = [];
    batchDeletes.push(db.collection('games').doc(gameId).delete());
    state.accounts.filter(function(a){return a.gameId===gameId;}).forEach(function(a){
      batchDeletes.push(db.collection('accounts').doc(a.id).delete());
    });
    state.clients.forEach(function(c){
      if ((c.allowedGameIds||[]).includes(gameId)){
        var newIds = c.allowedGameIds.filter(function(id){return id!==gameId;});
        batchDeletes.push(db.collection('clients').doc(c.id).update({ allowedGameIds: newIds }));
      }
    });
    return Promise.all(batchDeletes);
  }
  function addAccount(gameId, email, senha, codigoVerificacao, fornecedor){
    return db.collection('accounts').add({
      gameId: gameId, email: email, senha: senha, codigoVerificacao: codigoVerificacao || '', fornecedor: fornecedor,
      status: 'livre', clienteNome: null, clienteTelefone: null, usadoEm: null, dataAproximada: false
    });
  }
  function deleteAccount(accountId){
    var acc = state.accounts.find(function(a){return a.id===accountId;});
    if (acc && acc.status==='livre') return db.collection('accounts').doc(accountId).delete();
    return Promise.resolve();
  }
  function editAccount(accountId, data){
    return db.collection('accounts').doc(accountId).update(data);
  }
  function addClient(nomeComprador, cep, allowedGameIds){
    return db.collection('clients').add({
      nomeComprador: nomeComprador, cep: cep, allowedGameIds: allowedGameIds,
      telefoneCliente: null, status: 'pendente', createdAt: new Date().toISOString(),
      resgatadoEm: null, gameIdResgatado: null, accountId: null
    });
  }
  function deleteClient(clientId){
    var c = state.clients.find(function(cl){return cl.id===clientId;});
    if (c && c.status==='pendente') return db.collection('clients').doc(clientId).delete();
    return Promise.resolve();
  }
  function assignAccount(gameId, clienteNome, clienteTelefone){
    var account = state.accounts.find(function(a){ return a.gameId===gameId && a.status==='livre'; });
    if (!account) return Promise.resolve(null);
    return db.collection('accounts').doc(account.id).update({
      status:'usado', clienteNome: clienteNome, clienteTelefone: clienteTelefone, usadoEm: new Date().toISOString(), dataAproximada: false
    }).then(function(){ return account; });
  }
  function resetAccount(accountId){
    var acc = state.accounts.find(function(a){return a.id===accountId;});
    if (!acc || acc.status!=='usado') return Promise.resolve();
    var ops = [];
    ops.push(db.collection('accounts').doc(accountId).update({
      status:'livre', clienteNome:null, clienteTelefone:null, usadoEm:null, dataAproximada:false
    }));
    var client = state.clients.find(function(c){ return c.accountId===accountId && c.status==='resgatado'; });
    if (client){
      ops.push(db.collection('clients').doc(client.id).update({
        status:'pendente', resgatadoEm:null, gameIdResgatado:null, accountId:null
      }));
    }
    return Promise.all(ops);
  }
  function markAccountUsed(accountId){
    var acc = state.accounts.find(function(a){return a.id===accountId;});
    if (!acc || acc.status!=='livre') return Promise.resolve();
    return db.collection('accounts').doc(accountId).update({
      status:'usado', clienteNome:null, clienteTelefone:null, usadoEm: new Date().toISOString(), dataAproximada:false
    });
  }
  function importSeedData(){
    if (!window.SEED_GAMES || !window.SEED_ACCOUNTS) return Promise.reject(new Error('sem dados de importação'));
    var batch = db.batch();
    window.SEED_GAMES.forEach(function(g){
      var data = Object.assign({}, g); delete data.id;
      batch.set(db.collection('games').doc(g.id), data);
    });
    window.SEED_ACCOUNTS.forEach(function(a){
      var data = Object.assign({}, a); delete data.id;
      batch.set(db.collection('accounts').doc(a.id), data);
    });
    return batch.commit();
  }

  function resetAllData(){
    var dels = [];
    state.games.forEach(function(g){ dels.push(db.collection('games').doc(g.id).delete()); });
    state.accounts.forEach(function(a){ dels.push(db.collection('accounts').doc(a.id).delete()); });
    state.clients.forEach(function(c){ dels.push(db.collection('clients').doc(c.id).delete()); });
    return Promise.all(dels);
  }

  // ---------------- events ----------------

  document.addEventListener('submit', function(e){
    var form = e.target;

    if (form.id === 'loginForm'){
      e.preventDefault();
      var u = document.getElementById('loginUser').value.trim();
      var pw = document.getElementById('loginPass').value;
      var okFallback = (state.adminUsers.length===0 && u==='admin' && pw==='admin123');
      var match = state.adminUsers.find(function(au){ return au.username===u && au.senha===pw; });
      if (okFallback || match){
        state.adminAuthed = true; state.loginError = null;
        state.currentAdminUser = match ? match.username : 'admin';
        try { sessionStorage.setItem('rr_admin','1'); } catch(err){}
      } else {
        state.loginError = 'Usuário ou senha inválidos.';
      }
      render();
      return;
    }

    if (form.id === 'addAdminForm'){
      e.preventDefault();
      var auUser = document.getElementById('auUser').value.trim();
      var auSenha = document.getElementById('auSenha').value.trim();
      if (!auUser || !auSenha){ state.adminMsg = {type:'error', text:'Preencha usuário e senha.'}; return render(); }
      if (state.adminUsers.length >= 2){ state.adminMsg = {type:'error', text:'Máximo de 2 logins de admin.'}; return render(); }
      if (state.adminUsers.some(function(au){ return au.username.toLowerCase()===auUser.toLowerCase(); })){
        state.adminMsg = {type:'error', text:'Já existe um login com esse usuário.'}; return render();
      }
      db.collection('admins').add({ username: auUser, senha: auSenha, createdAt: new Date().toISOString() }).then(function(){
        state.adminMsg = {type:'success', text:'Login de admin criado.'};
        render();
      });
      return;
    }

    if (form.id === 'addAccessForm'){
      e.preventDefault();
      var gNome = document.getElementById('newGameName').value.trim();
      var accEmail = document.getElementById('newAccEmail').value.trim();
      var accSenha = document.getElementById('newAccSenha').value.trim();
      var accCodigo = document.getElementById('newAccCodigo').value.trim();
      var accFornecedor = document.getElementById('newAccFornecedor').value.trim();

      if (!gNome || !accEmail || !accSenha || !accFornecedor){
        state.msg = {type:'error', text:'Preencha nome do jogo, e-mail, senha e fornecedor.'};
        return render();
      }

      var existing = findGameByName(gNome);
      var gamePromise = existing ? Promise.resolve(existing.id) : addGame(gNome).then(function(ref){ return ref.id; });

      gamePromise.then(function(gameId){
        return addAccount(gameId, accEmail, accSenha, accCodigo, accFornecedor);
      }).then(function(){
        state.msg = {type:'success', text: (existing ? 'Acesso adicionado a ' : 'Jogo criado e acesso adicionado: ') + gNome + '.'};
        render();
      });
      return;
    }

    if (form.id === 'editAccountForm'){
      e.preventDefault();
      var editId = form.getAttribute('data-id');
      var eaEmail = document.getElementById('eaEmail').value.trim();
      var eaSenha = document.getElementById('eaSenha').value.trim();
      var eaCodigo = document.getElementById('eaCodigo').value.trim();
      var eaFornecedor = document.getElementById('eaFornecedor').value.trim();
      if (!eaEmail || !eaSenha || !eaFornecedor){
        state.msg = {type:'error', text:'Preencha e-mail, senha e fornecedor.'};
        return render();
      }
      editAccount(editId, { email: eaEmail, senha: eaSenha, codigoVerificacao: eaCodigo, fornecedor: eaFornecedor }).then(function(){
        state.editingAccount = null;
        state.msg = {type:'success', text:'Acesso atualizado.'};
        render();
      });
      return;
    }

    if (form.id === 'configForm'){
      e.preventDefault();
      var videoUrl = document.getElementById('cfgVideo').value.trim();
      var lojaNome = document.getElementById('cfgLoja').value.trim();
      var whatsapp = document.getElementById('cfgWhats').value.trim().replace(/\D/g,'');
      setConfig(videoUrl, lojaNome, whatsapp).then(function(){
        state.configMsg = {type:'success', text:'Configuração salva.'};
        render();
      });
      return;
    }

    if (form.id === 'addClientForm'){
      e.preventDefault();
      var cNome = document.getElementById('cNome').value.trim();
      var cCep = document.getElementById('cCep').value.trim();
      var ids = Array.prototype.slice.call(document.querySelectorAll('.ck-game:checked')).map(function(el){return el.value;});
      if (!cNome || !cCep){ state.msg = {type:'error', text:'Preencha nome e CEP.'}; return render(); }
      addClient(cNome, cCep, ids).then(function(){
        state.msg = {type:'success', text:'Cliente cadastrado.'};
        render();
      });
      return;
    }

    if (form.id === 'manualForm'){
      e.preventDefault();
      var clientId = document.getElementById('manClient').value;
      var nomeM = document.getElementById('manNome').value.trim();
      var telM = document.getElementById('manTelefone').value.trim();
      var gameIdM = document.getElementById('manGame').value;
      if (!nomeM || !telM || !gameIdM){ state.manualError = 'Preencha todos os campos.'; state.manualSuccess=null; return render(); }
      assignAccount(gameIdM, nomeM, telM).then(function(account){
        if (!account){ state.manualError = 'Não há acessos livres para este jogo.'; state.manualSuccess=null; return render(); }
        var chain = Promise.resolve();
        if (clientId){
          chain = db.collection('clients').doc(clientId).update({
            status:'resgatado', telefoneCliente: telM, resgatadoEm: new Date().toISOString(),
            gameIdResgatado: gameIdM, accountId: account.id
          });
        }
        chain.then(function(){
          var g = state.games.find(function(gg){return gg.id===gameIdM;});
          state.manualError = null;
          state.manualSuccess = 'Acesso liberado: ' + account.email + ' / ' + account.senha + (g?(' ('+g.nome+')'):'');
          render();
        });
      });
      return;
    }

    if (form.id === 'step1Form'){
      e.preventDefault();
      var a1 = getAttempts();
      if (isLocked(a1)) return render();
      var nome1 = document.getElementById('s1Nome').value.trim();
      var tel1 = document.getElementById('s1Tel').value.trim();
      if (!nome1 || !tel1){ state.public.error = 'Preencha todos os campos.'; return render(); }
      state.public.nomeComprador = nome1;
      state.public.telefone = tel1;
      state.public.error = null;
      state.public.step = 2;
      render();
      return;
    }

    if (form.id === 'step2Form'){
      e.preventDefault();
      var a2 = getAttempts();
      if (isLocked(a2)) return render();
      var cep2 = document.getElementById('s2Cep').value;
      var nomeAlvo = normNome(state.public.nomeComprador);
      var cepAlvo = normCep(cep2);
      var client = state.clients.find(function(c){
        return c.status==='pendente' && normNome(c.nomeComprador)===nomeAlvo && normCep(c.cep)===cepAlvo;
      });
      if (!client){
        var jaResgatado = state.clients.find(function(c){
          return c.status==='resgatado' && normNome(c.nomeComprador)===nomeAlvo && normCep(c.cep)===cepAlvo;
        });
        if (jaResgatado){
          registerSuccess();
          state.public.clientId = jaResgatado.id;
          state.public.resultAccountId = jaResgatado.accountId;
          state.public.error = null;
          state.public.step = 4;
          return render();
        }
        var st = registerFailure();
        if (isLocked(st)) return render();
        var restantes = MAX_TENT - st.count;
        state.public.error = 'Dados não conferem. Você tem mais ' + restantes + ' tentativa(s) antes do bloqueio temporário.';
        return render();
      }
      registerSuccess();
      db.collection('clients').doc(client.id).update({ telefoneCliente: state.public.telefone }).then(function(){
        state.public.clientId = client.id;
        state.public.error = null;
        state.public.step = 3;
        render();
      });
      return;
    }
  });

  document.addEventListener('input', function(e){
    if (e.target && e.target.id === 'newGameName'){
      var box = document.getElementById('gameSuggestions');
      if (!box) return;
      var q = e.target.value.trim().toLowerCase();
      if (!q){ box.innerHTML=''; return; }
      var matches = state.games.filter(function(g){ return g.nome.toLowerCase().indexOf(q) !== -1; }).slice(0,6);
      if (matches.length === 0){ box.innerHTML=''; return; }
      box.innerHTML = matches.map(function(g){
        var l = state.accounts.filter(function(a){return a.gameId===g.id && a.status==='livre';}).length;
        return '<div data-suggest-game="'+g.id+'" data-suggest-name="'+esc(g.nome)+'" style="padding:10px 13px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);" onmouseover="this.style.background=\'var(--surface-2)\'" onmouseout="this.style.background=\'transparent\'">'+esc(g.nome)+' <span class="muted">— jogo já existe, '+l+' livre(s)</span></div>';
      }).join('');
    }
  });

  document.addEventListener('mousedown', function(e){
    var sugg = e.target.closest('[data-suggest-name]');
    if (sugg){
      var input = document.getElementById('newGameName');
      if (input) input.value = sugg.getAttribute('data-suggest-name');
      var box = document.getElementById('gameSuggestions');
      if (box) box.innerHTML = '';
    }
  });

  document.addEventListener('focusout', function(e){
    if (e.target && e.target.id === 'newGameName'){
      setTimeout(function(){ var box = document.getElementById('gameSuggestions'); if (box) box.innerHTML=''; }, 150);
    }
  });

  document.addEventListener('click', function(e){
    var navBtn = e.target.closest('[data-nav]');
    if (navBtn){ state.view = navBtn.getAttribute('data-nav'); return render(); }

    var adminTabBtn = e.target.closest('[data-admintab]');
    if (adminTabBtn){ state.adminTab = adminTabBtn.getAttribute('data-admintab'); state.msg=null; return render(); }

    var clientFilterBtn = e.target.closest('[data-clientfilter]');
    if (clientFilterBtn){ state.clientFilter = clientFilterBtn.getAttribute('data-clientfilter'); return render(); }

    var confirmBtn = e.target.closest('[data-confirm]');
    if (confirmBtn){
      var answer = confirmBtn.getAttribute('data-confirm');
      var c = state.confirm;
      if (!c) return;
      if (answer === 'no'){ state.confirm = null; return render(); }
      var steps = CONFIRM_STEPS[c.kind] || [];
      if (c.step < steps.length - 1){
        state.confirm = { kind:c.kind, id:c.id, step:c.step+1 };
        return render();
      }
      // última etapa confirmada — executa a ação de verdade
      state.confirm = null;
      if (c.kind === 'delete-game'){
        return deleteGame(c.id).then(function(){ state.msg={type:'success',text:'Jogo excluído.'}; render(); });
      }
      if (c.kind === 'delete-account'){
        return deleteAccount(c.id).then(render);
      }
      if (c.kind === 'delete-client'){
        return deleteClient(c.id).then(render);
      }
      if (c.kind === 'delete-admin'){
        return db.collection('admins').doc(c.id).delete().then(render);
      }
      if (c.kind === 'reset-all'){
        return resetAllData().then(function(){ state.msg={type:'success',text:'Dados resetados.'}; render(); });
      }
      if (c.kind === 'reset-account'){
        return resetAccount(c.id).then(function(){ state.msg={type:'success',text:'Acesso liberado novamente.'}; render(); });
      }
      if (c.kind === 'mark-used'){
        return markAccountUsed(c.id).then(function(){ state.msg={type:'success',text:'Acesso marcado como usado.'}; render(); });
      }
      return;
    }

    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn){
      var action = actionBtn.getAttribute('data-action');
      var id = actionBtn.getAttribute('data-id');

      if (action === 'logout'){
        state.adminAuthed = false;
        try { sessionStorage.removeItem('rr_admin'); } catch(err){}
        return render();
      }
      if (action === 'toggle-game'){
        state.expandedGames[id] = !state.expandedGames[id];
        return render();
      }
      if (action === 'toggle-account'){
        state.expandedAccounts[id] = !state.expandedAccounts[id];
        return render();
      }
      if (action === 'edit-account'){
        state.editingAccount = id;
        return render();
      }
      if (action === 'cancel-edit-account'){
        state.editingAccount = null;
        return render();
      }
      if (action === 'delete-game'){
        state.confirm = { kind:'delete-game', id:id, step:0 };
        return render();
      }
      if (action === 'delete-account'){
        state.confirm = { kind:'delete-account', id:id, step:0 };
        return render();
      }
      if (action === 'delete-client'){
        state.confirm = { kind:'delete-client', id:id, step:0 };
        return render();
      }
      if (action === 'delete-admin'){
        state.confirm = { kind:'delete-admin', id:id, step:0 };
        return render();
      }
      if (action === 'reset-all'){
        state.confirm = { kind:'reset-all', id:null, step:0 };
        return render();
      }
      if (action === 'import-seed'){
        state.importMsg = {type:'info', text:'Importando...'};
        render();
        importSeedData().then(function(){
          state.importMsg = {type:'success', text:'Importação concluída!'};
          render();
        }).catch(function(err){
          state.importMsg = {type:'error', text:'Erro ao importar: '+err.message};
          render();
        });
        return;
      }
      if (action === 'back-step1'){
        state.public.step = 1; state.public.error = null; return render();
      }
      if (action === 'reset-public'){
        state.public = { step:1, nomeComprador:'', telefone:'', cep:'', clientId:null, resultAccountId:null, error:null };
        return render();
      }
      if (action === 'ask-confirm-game'){
        state.public.confirmGameId = id;
        return render();
      }
      if (action === 'cancel-confirm'){
        state.public.confirmGameId = null;
        return render();
      }
      if (action === 'confirm-assign'){
        var client3 = state.clients.find(function(c){ return c.id === state.public.clientId; });
        if (!client3) return;
        assignAccount(id, client3.nomeComprador, client3.telefoneCliente).then(function(account){
          if (!account){ state.public.error = 'Esse jogo ficou sem estoque agora. Escolha outro ou fale conosco.'; state.public.confirmGameId = null; return render(); }
          db.collection('clients').doc(client3.id).update({
            status:'resgatado', resgatadoEm: new Date().toISOString(), gameIdResgatado: id, accountId: account.id
          }).then(function(){
            state.public.resultAccountId = account.id;
            state.public.step = 4;
            state.public.error = null;
            state.public.confirmGameId = null;
            render();
          });
        });
      }
      if (action === 'reset-account'){
        state.confirm = { kind:'reset-account', id:id, step:0 };
        return render();
      }
      if (action === 'mark-used'){
        state.confirm = { kind:'mark-used', id:id, step:0 };
        return render();
      }
    }
  });

  // ---------------- boot ----------------

  function subscribe(colName, key){
    db.collection(colName).onSnapshot(function(snap){
      state[key] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){
      console.error(colName, err);
    });
  }

  function start(){
    var app = document.getElementById('app');
    if (!db){
      app.innerHTML = renderHeader() + '<div class="card"><p class="muted">Não foi possível conectar ao banco de dados. Verifique sua internet e recarregue a página.</p></div>';
      return;
    }
    subscribe('games','games');
    subscribe('accounts','accounts');
    subscribe('clients','clients');
    subscribe('admins','adminUsers');
    db.doc('config/app').onSnapshot(function(snap){
      state.config = snap.exists ? snap.data() : {};
      render();
    }, function(err){ console.error('config', err); });
    render();
  }

  (function(){
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      db = firebase.firestore();
    } catch(e){ console.error('Erro ao iniciar Firebase', e); db = null; }
    start();
  })();

})();

})();
</script>
</body>
</html>
